name: Deploy to Pages

# The site is three static files, a manifest and the rendered audio. Rendering
# stays in the generator repo (`interval-track-maker`) and never runs here: it
# needs Chromium, ffmpeg and the TTS weights. The audio ships with the site
# because iOS refuses Release assets (octet-stream + Content-Disposition), while
# Pages serves .mp3 as audio/mp3 with Range support.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4